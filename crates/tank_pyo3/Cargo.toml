[package]
name = "tank_pyo3"
version = "0.1.0"
edition = "2021"

[lib]
name = "tank_arena"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
tank_core = { path = "../tank_core", default-features = false }

[features]
# Native window (needs system GUI libraries). Disable for headless training machines:
#   maturin develop --release --no-default-features
default = ["gui"]
gui = ["tank_core/gui"]
